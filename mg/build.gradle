plugins {
    id 'com.android.library'
}

android {
    namespace 'ru.whbex.mobileglues_aar'
    compileSdk 36

    defaultConfig {
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    ndkVersion "29.0.14206865"

    externalNativeBuild {
        cmake {
            path "src/main/mg/MobileGlues-cpp/CMakeLists.txt"
        }
    }
}

dependencies {

}
